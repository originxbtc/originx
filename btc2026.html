function tMin(t) { const [h,m] = t.split(":").map(Number); return h*60+m; }
function fmtDur(s,e) { return `${tMin(e)-tMin(s)}분`; }

// ─── 라스베가스 시간 (PST/PDT, UTC-7 in April) → UTC 변환 ─────────
// 4/27~29는 PDT(UTC-7). Day 1 = 4/27, Day 2 = 4/28, Day 3 = 4/29.
function sessionToUTC(s) {
  const day = 26 + s.day; // 1→27, 2→28, 3→29
  const [sh, sm] = s.start.split(":").map(Number);
  const [eh, em] = s.end.split(":").map(Number);
  // PDT (UTC-7): 라스베가스 시간 + 7시간 = UTC
  const startUTC = new Date(Date.UTC(2026, 3, day, sh + 7, sm, 0));
  const endUTC   = new Date(Date.UTC(2026, 3, day, eh + 7, em, 0));
  return { startUTC, endUTC };
}
function fmtICSDate(d) {
  // YYYYMMDDTHHMMSSZ
  const p = n => String(n).padStart(2, "0");
  return `${d.getUTCFullYear()}${p(d.getUTCMonth()+1)}${p(d.getUTCDate())}T${p(d.getUTCHours())}${p(d.getUTCMinutes())}00Z`;
}
function fmtGCalDate(d) { return fmtICSDate(d); } // 동일 형식
function escICS(text) { return String(text||"").replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;"); }

// ICS 파일 텍스트 생성 (10분 전 알람 포함)
function buildICS(items) {
  const lines = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Bitcoin 2026 LV//OriginX Dashboard//KO",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH",
    "X-WR-CALNAME:Bitcoin 2026 Las Vegas",
    "X-WR-TIMEZONE:America/Los_Angeles",
  ];
  const stamp = fmtICSDate(new Date());
  items.forEach(s => {
    const { startUTC, endUTC } = sessionToUTC(s);
    const star = s.star ? "⭐".repeat(s.star) + " " : "";
    const summary = `${star}${s.titleKo}`;
    const desc = [
      s.titleEn ? `[EN] ${s.titleEn}` : "",
      `Speakers: ${s.speakers}`,
      s.note ? `\\n${s.note}` : "",
    ].filter(Boolean).join("\\n");
    lines.push(
      "BEGIN:VEVENT",
      `UID:${s.id}@btc2026-originx`,
      `DTSTAMP:${stamp}`,
      `DTSTART:${fmtICSDate(startUTC)}`,
      `DTEND:${fmtICSDate(endUTC)}`,
      `SUMMARY:${escICS(summary)}`,
      `LOCATION:${escICS(s.stage + ", The Venetian, Las Vegas")}`,
      `DESCRIPTION:${escICS(desc)}`,
      // 10분 전 알람
      "BEGIN:VALARM",
      "ACTION:DISPLAY",
      `DESCRIPTION:${escICS(s.titleKo)}`,
      "TRIGGER:-PT10M",
      "END:VALARM",
      "END:VEVENT",
    );
  });
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}

// 단일 세션 → Google Calendar 추가 URL
function googleCalUrl(s) {
  const { startUTC, endUTC } = sessionToUTC(s);
  const star = s.star ? "⭐".repeat(s.star) + " " : "";
  const text = `${star}${s.titleKo}`;
  const details = [
    s.titleEn ? `[EN] ${s.titleEn}` : "",
    `Speakers: ${s.speakers}`,
    s.note ? `\n\n${s.note}` : "",
  ].filter(Boolean).join("\n");
  const params = new URLSearchParams({
    action: "TEMPLATE",
    text,
    dates: `${fmtGCalDate(startUTC)}/${fmtGCalDate(endUTC)}`,
    details,
    location: `${s.stage}, The Venetian, Las Vegas`,
    ctz: "America/Los_Angeles",
  });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

// ICS 파일 다운로드
function downloadICS(items, filename = "bitcoin2026.ics") {
  const text = buildICS(items);
  const blob = new Blob([text], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}

// 선택 ID들을 URL 해시에 인코딩 (팀원 공유용)
function buildShareUrl(ids) {
  const base = location.origin + location.pathname;
  return `${base}#sel=${encodeURIComponent(ids.join(","))}`;
}
function readSelFromUrl() {
  const m = location.hash.match(/sel=([^&]+)/);
  if (!m) return null;
  try { return decodeURIComponent(m[1]).split(",").filter(Boolean); }
  catch (e) { return null; }
}

// 이미지 캡처 (html2canvas)
async function captureToBlob(domNode) {
  if (!window.html2canvas) throw new Error("html2canvas not loaded");
  const canvas = await window.html2canvas(domNode, {
    backgroundColor: "#0a0a0a",
    scale: 2, // retina 품질
    useCORS: true,
    logging: false,
  });
  return new Promise(resolve => canvas.toBlob(resolve, "image/png"));
}

// 이미지 다운로드
async function downloadImage(domNode, filename = "bitcoin2026-itinerary.png") {
  const blob = await captureToBlob(domNode);
  if (!blob) return false;
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  return true;
}

// Web Share API (모바일 네이티브 공유 시트)
async function shareItinerary({ items, imageBlob, shareUrl }) {
  const text = items.map(s => `${s.start}–${s.end} | ${s.titleKo} (${s.stage})`).join("\n");
  const fullText = `🟧 Bitcoin 2026 Las Vegas — 내 일정 (${items.length}개 세션)\n\n${text}\n\n링크: ${shareUrl}`;
  if (navigator.share) {
    const data = { title: "Bitcoin 2026 LV — 내 일정", text: fullText, url: shareUrl };
    if (imageBlob && navigator.canShare?.({ files: [new File([imageBlob], "schedule.png", { type:"image/png" })] })) {
      data.files = [new File([imageBlob], "schedule.png", { type:"image/png" })];
    }
    try { await navigator.share(data); return true; } catch(e) { /* user cancelled */ return false; }
  }
  // fallback: clipboard
  try { await navigator.clipboard.writeText(fullText); return "clipboard"; } catch(e) { return false; }
}

  function flash(msg) { setToast(msg); setTimeout(() => setToast(null), 2400); }

  const rows = [];
  for (let i=0; i<sorted.length; i++) {
    const cur = sorted[i];
    rows.push({ type:"session", s: cur });
    if (i < sorted.length-1) {
      const nxt = sorted[i+1];
      const gap = tMin(nxt.start) - tMin(cur.end);
      const walk = walkMin(cur.stage, nxt.stage);
      let kind = "ok";
      if (gap < 0) kind = "conflict";
      else if (gap < walk) kind = "tight";
      else if (gap > 30) kind = "wait";
      rows.push({ type:"transit", from: cur, to: nxt, gap, walk, kind });
    }
  }

  // ─── 액션 핸들러 ────────────────────────────────────────────
  async function onSaveImage() {
    if (!captureRef.current || sorted.length === 0) return;
    setBusy("image");
    try {
      const ok = await downloadImage(captureRef.current, `bitcoin2026-day${sorted[0]?.day || 1}.png`);
      if (ok) flash("✅ 이미지 저장됨 (다운로드 폴더 확인)");
      else flash("⚠️ 이미지 저장 실패");
    } catch (e) { console.error(e); flash("⚠️ 이미지 저장 실패"); }
    setBusy(null);
  }

  async function onShareNative() {
    if (sorted.length === 0) return;
    setBusy("share");
    try {
      const blob = captureRef.current ? await captureToBlob(captureRef.current).catch(()=>null) : null;
      const shareUrl = buildShareUrl(sorted.map(s => s.id));
      const r = await shareItinerary({ items: sorted, imageBlob: blob, shareUrl });
      if (r === true) flash("✅ 공유 완료");
      else if (r === "clipboard") flash("📋 클립보드에 복사됨 (공유 시트 미지원 브라우저)");
    } catch (e) { console.error(e); }
    setBusy(null);
  }

  function onCopyLink() {
    const url = buildShareUrl(sorted.map(s => s.id));
    navigator.clipboard?.writeText(url);
    flash("🔗 링크 복사됨 — 팀원에게 보내면 동일 일정으로 열림");
  }

  function onDownloadICS() {
    if (sorted.length === 0) return;
    setBusy("ics");
    try {
      downloadICS(sorted, `bitcoin2026-day${sorted[0]?.day || 1}.ics`);
      flash("📲 .ics 다운로드 완료 — iPhone에서 파일 열면 캘린더에 자동 추가 (10분 전 알람 포함)");
    } catch (e) { console.error(e); flash("⚠️ 다운로드 실패"); }
    setBusy(null);
  }

  function onAddToGoogle() {
    if (sorted.length === 0) return;
    if (sorted.length > 5) {
      const ok = confirm(`${sorted.length}개 세션을 각각 새 탭으로 열어 Google Calendar에 추가합니다. 계속하시겠습니까?\n\n(팝업 차단 해제 필요. 많을 경우 .ics 다운로드를 권장합니다.)`);
      if (!ok) return;
    }
    sorted.forEach((s, idx) => {
      // 팝업 차단 회피용 약간의 시차
      setTimeout(() => window.open(googleCalUrl(s), "_blank"), idx * 200);
    });
    flash(`📅 ${sorted.length}개 탭이 열림 — 각 탭에서 '저장' 클릭`);
  }

  function onCopyText() {
    const txt = sorted.map(s => `${s.start}–${s.end} | ${s.stage}\n${s.star?"⭐".repeat(s.star)+" ":""}${s.titleKo}\n${s.speakers}`).join("\n\n");
    navigator.clipboard?.writeText(txt);
    flash("📋 텍스트 복사 완료");
  }

  return (
    <div className="fixed inset-0 bg-black/80 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm" onClick={onClose}>
      <div className="bg-zinc-950 border border-zinc-800 rounded-t-2xl sm:rounded-2xl w-full sm:max-w-2xl max-h-[92vh] flex flex-col slide-up" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between p-4 border-b border-zinc-800 sticky top-0 bg-zinc-950 z-10">
          <div>
            <h2 className="text-lg font-bold text-orange-400">내 동선 일정</h2>
            <p className="text-xs text-zinc-500">{sorted.length}개 세션 · 시간순 + 이동시간 계산됨</p>
          </div>
          <button onClick={onClose} className="text-zinc-400 hover:text-white p-2 -m-2 text-2xl leading-none">×</button>
        </div>

        <div className="overflow-y-auto">
          {/* 캡처용 컨테이너 — 이미지 출력 시 이 영역만 캡처 */}
          <div ref={captureRef} className="p-4 space-y-2 bg-zinc-950">
            {/* 캡처 시 보일 헤더 */}
            <div className="mb-3 pb-3 border-b border-zinc-800">
              <div className="flex items-center justify-between">
                <div>
                  <h3 className="text-base font-bold text-orange-400">🟧 Bitcoin 2026 Las Vegas</h3>
                  <p className="text-[10px] text-zinc-500">The Venetian · April 27–29, 2026</p>
                </div>
                <div className="text-right">
                  <p className="text-[10px] text-zinc-600">총 {sorted.length}개 세션</p>
                  <p className="text-[9px] text-zinc-700">⭐⭐ 핵심 담론 / ⭐ 주요 담론</p>
                </div>
              </div>
            </div>

            {sorted.length === 0 && (
              <div className="text-center py-12 text-zinc-500">
                <p>선택된 세션이 없습니다.</p>
                <p className="text-xs mt-2">메인 화면에서 들을 세션을 체크해주세요.</p>
              </div>
            )}
            {rows.map((row, idx) => {
              if (row.type === "session") {
                const stg = STAGES[row.s.stage] || { color:"#666" };
                return (
                  <div key={idx} className="bg-zinc-900/80 border border-zinc-800 rounded-xl p-3 relative overflow-hidden">
                    <div className="absolute left-0 top-0 bottom-0 w-1" style={{background:stg.color}}/>
                    <div className="pl-2">
                      <div className="flex items-center gap-2 mb-1 text-xs font-mono text-zinc-300">
                        <span className="text-orange-400 font-bold">{row.s.start}</span>
                        <span className="text-zinc-600">–</span>
                        <span>{row.s.end}</span>
                        <StarBadge level={row.s.star} />
                      </div>
                      <h4 className="text-sm font-semibold text-white mb-1">{row.s.titleKo}</h4>
                      <div className="flex items-center gap-2 text-xs text-zinc-400">
                        <span className="font-medium" style={{color: stg.color}}>📍 {row.s.stage}</span>
                      </div>
                      <p className="text-[11px] text-zinc-500 mt-1">{row.s.speakers}</p>
                    </div>
                  </div>
                );
              }
              const colorMap = {
                conflict: { bg:"bg-red-500/10",   border:"border-red-500/40",    text:"text-red-300",    icon:"⚠️", title:"시간 충돌" },
                tight:    { bg:"bg-amber-500/10", border:"border-amber-500/40",  text:"text-amber-300",  icon:"⏱️", title:"빠듯함" },
                ok:       { bg:"bg-zinc-800/40",  border:"border-zinc-700/50",   text:"text-zinc-400",   icon:"🚶", title:"이동" },
                wait:     { bg:"bg-blue-500/10",  border:"border-blue-500/30",   text:"text-blue-300",   icon:"☕", title:"여유" },
              };
              const c = colorMap[row.kind];
              return (
                <div key={idx} className={`${c.bg} border ${c.border} rounded-lg px-3 py-2 ml-4 text-xs flex items-start gap-2`}>
                  <span className="text-base">{c.icon}</span>
                  <div className={`${c.text} flex-1`}>
                    <div className="font-semibold mb-0.5">{c.title}</div>
                    <div className="text-[11px] opacity-90">
                      {row.kind === "conflict" && (<>다음 세션이 <b>{Math.abs(row.gap)}분 일찍</b> 시작 — 한쪽 포기 필요. 도보 {row.walk}분.</>)}
                      {row.kind === "tight" && (<>휴식 {row.gap}분 / 도보 {row.walk}분 — <b>지각 위험.</b> 세션 끝까지 듣지 말고 미리 이동.</>)}
                      {row.kind === "ok" && (<>휴식 {row.gap}분 / 도보 {row.walk}분 ({row.from.stage.split(" ")[0]} → {row.to.stage.split(" ")[0]})</>)}
                      {row.kind === "wait" && (<>{row.gap}분 여유 / 도보 {row.walk}분 — 네트워킹·식사·EXPO 부스 둘러보기 가능</>)}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* 토스트 */}
        {toast && (
          <div className="absolute bottom-32 left-1/2 -translate-x-1/2 bg-zinc-800 text-zinc-100 text-xs px-4 py-2 rounded-full border border-zinc-700 shadow-xl z-30 max-w-[90%] text-center">
            {toast}
          </div>
        )}

        {/* 공유/내보내기 액션 영역 */}
        {sorted.length > 0 && (
          <div className="border-t border-zinc-800 p-3 safe-bottom space-y-2">
            {/* 1행: 공유 (이미지/네이티브/링크) */}
            <div className="grid grid-cols-3 gap-2">
              <button onClick={onSaveImage} disabled={busy==="image"}
                className="py-2.5 bg-orange-500 hover:bg-orange-400 disabled:bg-zinc-800 text-black disabled:text-zinc-600 rounded-lg text-xs font-bold transition flex flex-col items-center gap-0.5">
                <span className="text-base">{busy==="image" ? "⏳" : "🖼️"}</span>
                <span>이미지 저장</span>
              </button>
              <button onClick={onShareNative} disabled={busy==="share"}
                className="py-2.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-100 rounded-lg text-xs font-bold transition flex flex-col items-center gap-0.5">
                <span className="text-base">{busy==="share" ? "⏳" : "📤"}</span>
                <span>공유하기</span>
              </button>
              <button onClick={onCopyLink}
                className="py-2.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-100 rounded-lg text-xs font-bold transition flex flex-col items-center gap-0.5">
                <span className="text-base">🔗</span>
                <span>링크 복사</span>
              </button>
            </div>

            {/* 2행: 캘린더 추가 */}
            <div className="grid grid-cols-2 gap-2">
              <button onClick={onAddToGoogle}
                className="py-2.5 bg-blue-600/20 hover:bg-blue-600/30 border border-blue-500/40 text-blue-200 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5">
                <span>📅</span><span>구글 캘린더</span>
              </button>
              <button onClick={onDownloadICS} disabled={busy==="ics"}
                className="py-2.5 bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-100 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5">
                <span>📱</span><span>아이폰 일정 등록하기</span>
              </button>
            </div>

            {/* 3행: 텍스트 (보조) */}
            <button onClick={onCopyText}
              className="w-full py-2 bg-transparent hover:bg-zinc-900 text-zinc-500 hover:text-zinc-300 rounded-lg text-[11px] transition">
              📋 텍스트로만 복사 (카톡/슬랙 메시지용)
            </button>

            <p className="text-[10px] text-zinc-600 text-center leading-relaxed pt-1">
              💡 .ics 파일은 각 세션 <b>10분 전 알람</b> 포함 · 시간대는 라스베가스(PDT) 기준
            </p>
          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const [day, setDay] = useState(1);
  const [view, setView] = useState("stage");
  const [filter, setFilter] = useState(null);
  const [starOnly, setStarOnly] = useState(false);
  const [selected, setSelected] = useState(new Set());
  const [showItin, setShowItin] = useState(false);
  const [showFloor, setShowFloor] = useState(false);

  useEffect(() => { (async () => {
    // 1) URL에 공유 링크 파라미터가 있으면 우선 적용
    const fromUrl = readSelFromUrl();
    if (fromUrl && fromUrl.length > 0) {
      setSelected(new Set(fromUrl));
      saveSelections(fromUrl);
      return;
    }
    // 2) 없으면 저장된 선택 불러옴
    const ids = await loadSelections();
    setSelected(new Set(ids));
  })(); }, []);

  const toggleSel = useCallback((id) => {
    setSelected(prev => {
      const n = new Set(prev);
      if (n.has(id)) n.delete(id); else n.add(id);
      saveSelections([...n]);
      return n;
    });
  }, []);

  const dayItems = useMemo(() => {
    let items = SESSIONS.filter(s => s.day === day);
    if (filter) items = items.filter(s => s.tags?.includes(filter));
    if (starOnly) items = items.filter(s => (s.star||0) >= 1);
    return items;
  }, [day, filter, starOnly]);

  const grouped = useMemo(() => {
    if (view === "time") return [["all", [...dayItems].sort((a,b)=>tMin(a.start)-tMin(b.start))]];
    const g = {};
    dayItems.forEach(s => { (g[s.stage] = g[s.stage] || []).push(s); });
    Object.values(g).forEach(arr => arr.sort((a,b)=>tMin(a.start)-tMin(b.start)));
    return Object.keys(STAGES).filter(k => g[k]).map(k => [k, g[k]]);
  }, [dayItems, view]);

  const selectedItems = SESSIONS.filter(s => selected.has(s.id));
  const selectedDay = selectedItems.filter(s => s.day === day);

  return (
    <div className="min-h-screen text-zinc-100 pb-32">
      <header className="sticky top-0 z-30 bg-black/95 backdrop-blur border-b border-zinc-900">
        <div className="max-w-3xl mx-auto px-4 py-3">
          <div className="flex items-center justify-between mb-2">
            <div>
              <h1 className="text-base font-bold text-orange-400 leading-tight">Bitcoin 2026 Las Vegas</h1>
              <p className="text-[10px] text-zinc-500 -mt-0.5">담론 맥락 동선 대시보드 · ⭐ 핵심 담론</p>
            </div>
            <button onClick={()=>setShowFloor(true)} className="text-xs px-2.5 py-1.5 bg-zinc-900 border border-zinc-800 rounded-lg text-zinc-300 hover:border-zinc-700">
              🗺️ 플로어플랜
            </button>
          </div>
          <div className="flex gap-1 mb-2">
            {[1,2,3].map(d => (
              <button key={d} onClick={()=>setDay(d)} className={`flex-1 py-2 rounded-lg text-xs font-bold transition ${day===d ? "bg-orange-500 text-black" : "bg-zinc-900 text-zinc-400 hover:bg-zinc-800"}`}>
                Day {d}<br/><span className="text-[9px] font-normal opacity-70">{["Mon Apr 27","Tue Apr 28","Wed Apr 29"][d-1]}</span>
              </button>
            ))}
          </div>
          <div className="flex gap-2 items-center overflow-x-auto no-scrollbar">
            <div className="flex bg-zinc-900 rounded-lg p-0.5 flex-shrink-0">
              <button onClick={()=>setView("stage")} className={`px-2.5 py-1 text-[11px] rounded ${view==="stage" ? "bg-zinc-700 text-white" : "text-zinc-500"}`}>스테이지별</button>
              <button onClick={()=>setView("time")} className={`px-2.5 py-1 text-[11px] rounded ${view==="time" ? "bg-zinc-700 text-white" : "text-zinc-500"}`}>시간순</button>
            </div>
            <button onClick={()=>setStarOnly(!starOnly)} className={`flex-shrink-0 px-2.5 py-1 text-[11px] rounded-full border whitespace-nowrap ${starOnly ? "bg-orange-500/20 border-orange-500/60 text-orange-300 font-semibold" : "bg-transparent border-zinc-800 text-zinc-400"}`}>
              ⭐ 핵심만
            </button>
            <button onClick={()=>setFilter(null)} className={`flex-shrink-0 px-2.5 py-1 text-[11px] rounded-full border ${!filter ? "bg-orange-500 border-orange-500 text-black font-semibold" : "bg-transparent border-zinc-800 text-zinc-400"}`}>전체</button>
            {Object.entries(TAGS).filter(([k])=>k!=="general").map(([k,t]) => (
              <button key={k} onClick={()=>setFilter(filter===k ? null : k)} className={`flex-shrink-0 px-2.5 py-1 text-[11px] rounded-full border whitespace-nowrap ${filter===k ? `${t.color} font-semibold` : "bg-transparent border-zinc-800 text-zinc-500"}`}>
                {t.emoji} {t.label}
              </button>
            ))}
          </div>
        </div>
      </header>

      <main className="max-w-3xl mx-auto px-4 pt-4 space-y-6">
        {grouped.map(([key, items]) => (
          <section key={key}>
            {view === "stage" && key !== "all" && (
              <div className="flex items-center gap-2 mb-2 sticky top-[140px] bg-black/95 backdrop-blur py-1.5 z-10">
                <div className="w-1 h-5 rounded" style={{background: STAGES[key].color}}/>
                <h2 className="text-sm font-bold" style={{color: STAGES[key].color}}>{key}</h2>
                <span className="text-[10px] text-zinc-600">· {STAGES[key].loc}</span>
                <span className="text-[10px] text-zinc-700 ml-auto">{items.length}개</span>
              </div>
            )}
            <div className="space-y-2">
              {items.map(s => <SessionCard key={s.id} s={s} checked={selected.has(s.id)} onToggle={toggleSel} />)}
            </div>
          </section>
        ))}
        {dayItems.length === 0 && (
          <div className="text-center py-12 text-zinc-500 text-sm">필터에 해당하는 세션이 없습니다</div>
        )}
      </main>

      <div className="fixed bottom-0 left-0 right-0 bg-black/95 backdrop-blur border-t border-zinc-900 safe-bottom z-20">
        <div className="max-w-3xl mx-auto px-4 py-3 flex items-center gap-3">
          <div className="flex-1 min-w-0">
            <p className="text-xs text-zinc-500">선택됨</p>
            <p className="text-base font-bold text-white">
              <span className="text-orange-400">{selected.size}</span>
              <span className="text-zinc-600 text-sm"> / {SESSIONS.length} 세션</span>
              {selectedDay.length > 0 && <span className="text-xs text-zinc-500 ml-2">(Day {day}: {selectedDay.length})</span>}
            </p>
          </div>
          <button onClick={() => setShowItin(true)} disabled={selected.size === 0}
            className="px-4 py-2.5 bg-orange-500 disabled:bg-zinc-800 disabled:text-zinc-600 text-black font-bold text-sm rounded-xl transition active:scale-95">
            내 일정 만들기 →
          </button>
        </div>
      </div>

      {showItin && <ItineraryModal items={selectedItems} onClose={()=>setShowItin(false)} />}
      {showFloor && <FloorPlanModal onClose={()=>setShowFloor(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
