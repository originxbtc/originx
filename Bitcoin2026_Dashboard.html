<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitcoin 2026 Las Vegas — 연사 대시보드</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --black: #0a0a0a; --dark: #1a1a1a; --mid: #555;
  --gray: #888; --light: #ddd; --lighter: #f2f2f2;
  --white: #fff; --accent: #f7931a; --accent-dim: rgba(247,147,26,0.13);
  --x-color: #000; --li-color: #0a66c2;
}
body { font-family: 'Segoe UI','맑은 고딕',sans-serif; background:#efefef; color:var(--dark); }

/* HEADER */
header {
  background:var(--black); color:var(--white);
  padding:20px 32px; display:flex; align-items:center; justify-content:space-between;
  border-bottom:3px solid var(--accent);
  position:sticky; top:0; z-index:200;
  gap:16px;
}
header h1 { font-size:1.25rem; font-weight:800; }
header h1 span { color:var(--accent); }
.meta { font-size:0.73rem; color:#888; margin-top:3px; }
.stats-bar { display:flex; gap:20px; flex-shrink:0; }
.stat { text-align:center; }
.stat-num { font-size:1.5rem; font-weight:800; color:var(--accent); line-height:1; }
.stat-lbl { font-size:0.65rem; color:#888; margin-top:2px; text-transform:uppercase; letter-spacing:.04em; }

/* NAV */
.nav-tabs {
  background:#111; display:flex; overflow-x:auto; padding:0 24px;
}
.nav-tab {
  padding:11px 18px; color:#888; font-size:0.82rem; font-weight:600;
  cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap;
  transition:all .18s;
}
.nav-tab:hover { color:#fff; }
.nav-tab.active { color:var(--accent); border-bottom-color:var(--accent); }

/* MAIN */
.main { padding:18px 24px; max-width:1600px; margin:0 auto; }
.page { display:none; }
.page.active { display:block; }

/* TOOLBAR */
.toolbar {
  background:var(--white);
  border-radius:10px;
  padding:14px 16px;
  margin-bottom:14px;
  border:1.5px solid var(--light);
  display:flex; flex-direction:column; gap:10px;
}
.toolbar-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.toolbar-label { font-size:0.7rem; font-weight:700; color:var(--gray); text-transform:uppercase; letter-spacing:.05em; min-width:68px; }
.search-box {
  flex:1; min-width:220px;
  display:flex; align-items:center;
  border:1.5px solid var(--light); border-radius:7px; padding:0 10px;
  background:#fafafa;
}
.search-box input {
  border:none; outline:none; padding:8px 6px; font-size:0.87rem;
  flex:1; background:transparent; color:var(--dark);
}

/* FILTER CHIPS */
.filter-chip {
  padding:6px 13px; border-radius:20px;
  border:1.5px solid var(--light); background:var(--white);
  font-size:0.77rem; cursor:pointer; font-weight:600; color:var(--mid);
  transition:all .15s; white-space:nowrap;
  display:inline-flex; align-items:center; gap:5px;
}
.filter-chip:hover { border-color:#999; color:var(--dark); }
.filter-chip.active { background:var(--dark); color:var(--white); border-color:var(--dark); }
.filter-chip.chip-star.active  { background:#c49000; border-color:#c49000; color:#fff; }
.filter-chip.chip-sns.active   { background:#1d9bf0; border-color:#1d9bf0; color:#fff; }
.filter-chip.chip-quote.active { background:#27ae60; border-color:#27ae60; color:#fff; }
.filter-chip.chip-key.active   { background:var(--accent); border-color:var(--accent); color:#fff; }

/* DIVIDER */
.chip-divider { width:1px; height:20px; background:var(--light); flex-shrink:0; }

/* RESULT */
.result-bar {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:12px; gap:8px;
}
.result-count { font-size:0.82rem; color:var(--gray); }
.result-count strong { color:var(--dark); font-size:0.95rem; }
.view-toggle { display:flex; gap:4px; }
.vbtn {
  padding:5px 9px; border:1.5px solid var(--light); border-radius:6px;
  background:var(--white); cursor:pointer; font-size:0.82rem; color:var(--gray);
  transition:all .15s;
}
.vbtn.active { background:var(--dark); color:var(--white); border-color:var(--dark); }

/* GRID */
.speaker-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(272px,1fr));
  gap:12px;
}
.speaker-grid.list-view {
  grid-template-columns:1fr;
}

/* CARD */
.speaker-card {
  background:var(--white);
  border:1.5px solid #e4e4e4;
  border-radius:10px; padding:15px;
  cursor:pointer; transition:all .18s;
  position:relative; display:flex; flex-direction:column; gap:0;
}
.speaker-card:hover {
  border-color:#999;
  box-shadow:0 4px 18px rgba(0,0,0,0.1);
  transform:translateY(-2px);
}
.speaker-card.is-featured { border-color:var(--accent); border-width:2px; }
.featured-badge {
  position:absolute; top:10px; right:10px;
  font-size:0.65rem; font-weight:700; color:var(--accent);
  background:var(--accent-dim); padding:2px 7px; border-radius:10px;
}

.card-top { display:flex; gap:11px; align-items:flex-start; margin-bottom:9px; }

/* AVATAR */
.avatar-wrap { width:46px; height:46px; flex-shrink:0; position:relative; }
.avatar-img {
  width:46px; height:46px; border-radius:50%; object-fit:cover;
  border:2px solid var(--lighter);
  display:block;
}
.avatar-img.featured { border-color:var(--accent); }
.avatar-img.hidden { display:none; }
.avatar-empty {
  width:46px; height:46px; border-radius:50%;
  background:var(--lighter); border:2px solid #e0e0e0;
  display:flex; align-items:center; justify-content:center;
}
.sns-badges {
  position:absolute; bottom:-3px; right:-4px;
  display:flex; gap:2px;
}
.sns-dot {
  width:14px; height:14px; border-radius:50%;
  border:1.5px solid var(--white);
  display:flex; align-items:center; justify-content:center;
  font-size:8px; font-weight:900;
}
.sns-dot.x-dot { background:#000; color:#fff; }
.sns-dot.li-dot { background:#0a66c2; color:#fff; font-size:7px; }

.card-info { flex:1; min-width:0; }
.card-name { font-size:0.92rem; font-weight:700; color:var(--black); line-height:1.2; }
.card-title { font-size:0.74rem; color:var(--gray); margin-top:2px; line-height:1.3;
  overflow:hidden; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; }
.card-company { font-size:0.8rem; color:var(--mid); font-weight:600; margin-top:3px; }

.card-tags { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:8px; }
.tag {
  font-size:0.67rem; padding:2px 7px; border-radius:10px;
  font-weight:600; white-space:nowrap;
}
.tag.cat { background:var(--dark); color:var(--white); }
.tag.country { background:var(--lighter); color:var(--dark); border:1px solid #ddd; }

.card-quote {
  font-size:0.74rem; color:var(--mid); line-height:1.5;
  overflow:hidden; display:-webkit-box;
  -webkit-line-clamp:2; -webkit-box-orient:vertical;
  border-left:2px solid var(--accent);
  padding-left:7px;
  font-style:italic;
}

/* LIST VIEW CARD */
.speaker-grid.list-view .speaker-card {
  flex-direction:row; align-items:center; gap:14px; padding:11px 16px;
}
.speaker-grid.list-view .card-top { margin-bottom:0; flex:0 0 auto; }
.speaker-grid.list-view .card-info { flex:2; }
.speaker-grid.list-view .card-tags { margin-bottom:0; }
.speaker-grid.list-view .card-quote { flex:3; -webkit-line-clamp:1; border-left:none; padding-left:0; color:var(--gray); }
.speaker-grid.list-view .card-name { font-size:0.88rem; }

/* MODAL */
.modal-overlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.55); z-index:1000;
  align-items:center; justify-content:center; padding:16px;
}
.modal-overlay.open { display:flex; }
.modal {
  background:var(--white); border-radius:14px;
  max-width:660px; width:100%; max-height:90vh; overflow-y:auto;
  padding:28px; position:relative;
  box-shadow:0 24px 70px rgba(0,0,0,0.3);
}
.modal-close {
  position:absolute; top:14px; right:14px;
  background:var(--lighter); border:none; width:28px; height:28px;
  border-radius:50%; cursor:pointer; font-size:0.9rem;
  display:flex; align-items:center; justify-content:center; color:var(--dark);
}
.modal-close:hover { background:var(--dark); color:var(--white); }
.modal-header { display:flex; gap:16px; align-items:flex-start; margin-bottom:20px; }
.modal-avatar-wrap { position:relative; flex-shrink:0; }
.modal-img {
  width:64px; height:64px; border-radius:50%; object-fit:cover;
  border:2px solid var(--lighter); display:block;
}
.modal-img.featured { border-color:var(--accent); border-width:3px; }
.modal-img.hidden { display:none; }
.modal-avatar-empty {
  width:64px; height:64px; border-radius:50%;
  background:var(--lighter); border:2px solid #e0e0e0;
  display:flex; align-items:center; justify-content:center;
  font-size:1.5rem; color:var(--gray);
}
.modal-sns-badges { position:absolute; bottom:-2px; right:-4px; display:flex; gap:2px; }
.modal-sns-dot {
  width:18px; height:18px; border-radius:50%;
  border:2px solid var(--white);
  display:flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:900;
}
.modal-sns-dot.x-dot { background:#000; color:#fff; }
.modal-sns-dot.li-dot { background:#0a66c2; color:#fff; font-size:9px; }
.modal-name { font-size:1.2rem; font-weight:800; color:var(--black); line-height:1.2; }
.modal-title { font-size:0.84rem; color:var(--gray); margin-top:3px; }
.modal-company { font-size:0.92rem; color:var(--mid); font-weight:700; margin-top:4px; }
.modal-tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.msec { margin-bottom:16px; }
.msec h4 {
  font-size:0.68rem; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--gray);
  margin-bottom:7px; padding-bottom:4px; border-bottom:1px solid var(--lighter);
}
.msec p { font-size:0.86rem; color:var(--dark); line-height:1.65; }
.quote-box {
  background:var(--lighter); border-left:3px solid var(--accent);
  padding:10px 14px; border-radius:0 7px 7px 0;
  font-size:0.87rem; color:var(--dark); line-height:1.65; font-style:italic;
}
.modal-links { display:flex; gap:7px; flex-wrap:wrap; }
.mlink {
  display:inline-flex; align-items:center; gap:5px;
  padding:7px 13px; border-radius:7px;
  border:1.5px solid var(--light);
  font-size:0.79rem; color:var(--dark); text-decoration:none; font-weight:600;
  transition:all .15s;
}
.mlink:hover { background:var(--dark); color:var(--white); border-color:var(--dark); }
.mlink.x-link { border-color:#000; color:#000; }
.mlink.x-link:hover { background:#000; color:#fff; }
.mlink.li-link { border-color:#0a66c2; color:#0a66c2; }
.mlink.li-link:hover { background:#0a66c2; color:#fff; }

/* CAT PAGE */
.cat-section { margin-bottom:24px; }
.cat-hdr {
  background:var(--dark); color:var(--white);
  padding:10px 18px; border-radius:8px 8px 0 0;
  font-size:0.93rem; font-weight:700;
  display:flex; justify-content:space-between; align-items:center;
}
.cat-cnt { font-size:0.76rem; color:#aaa; }
.cat-list {
  background:var(--white); border:1.5px solid var(--light);
  border-top:none; border-radius:0 0 8px 8px;
  display:grid; grid-template-columns:repeat(auto-fill,minmax(255px,1fr));
}
.cat-item {
  padding:11px 15px; border-bottom:1px solid var(--lighter);
  border-right:1px solid var(--lighter);
  cursor:pointer; transition:background .15s;
}
.cat-item:hover { background:var(--lighter); }
.cat-item-name { font-size:0.87rem; font-weight:700; color:var(--black); }
.cat-item-meta { font-size:0.73rem; color:var(--gray); margin-top:2px; }
.cat-item-q { font-size:0.72rem; color:var(--mid); margin-top:4px; line-height:1.4;
  overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }

/* SESSION PAGE */
.session-card { background:var(--white); border:1.5px solid #e4e4e4; border-radius:10px; margin-bottom:13px; overflow:hidden; }
.session-ttl { background:var(--dark); color:var(--white); padding:13px 18px; font-size:0.95rem; font-weight:700; }
.session-body { padding:14px 18px; }
.session-content { font-size:0.84rem; color:var(--mid); margin-bottom:10px; line-height:1.6; }
.session-speakers { font-size:0.82rem; color:var(--dark); line-height:1.7; }
.session-speakers strong { font-weight:700; }

/* SCROLLBAR */
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:#f0f0f0; }
::-webkit-scrollbar-thumb { background:#ccc; border-radius:3px; }

@media(max-width:600px){
  header { flex-direction:column; align-items:flex-start; }
  .stats-bar { gap:14px; }
  .speaker-grid { grid-template-columns:1fr; }
}
</style>
</head>

  <div class="result-bar">

    <div class="view-toggle">
      <button class="vbtn active" onclick="setView('grid',this)" title="카드 보기">⊞</button>
      <button class="vbtn" onclick="setView('list',this)" title="리스트 보기">☰</button>
    </div>
  </div>
  <div class="speaker-grid" id="speakerGrid"></div>
</div>

<!-- PAGE: 카테고리 -->
<div id="page-categories" class="page">
  <div id="catPage"></div>
</div>

<!-- PAGE: 세션 -->
<div id="page-sessions" class="page">
  <div id="sessionsPage"></div>
</div>

</div><!-- /main -->

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal" id="modalContent"></div>
</div>

// ── AVATAR helper ─────────────────────────────────────────────
function getAvatarUrl(s) {
  if (s.x_handle && s.x_handle.startsWith('@')) {
    const handle = s.x_handle.replace('@','');
    return `https://unavatar.io/x/${handle}`;
  }
  return null;
}

function hasSnS(s) {
  return (s.x_handle && s.x_handle.startsWith('@')) || (s.linkedin && s.linkedin.includes('linkedin'));
}

function makeAvatarHtml(s, size) {
  const imgSize = size || 46;
  const dotSize = size === 64 ? 'modal-sns-dot' : 'sns-dot';
  const wrapClass = size === 64 ? 'modal-avatar-wrap' : 'avatar-wrap';
  const imgClass = 'avatar-img' + (s.featured ? ' featured' : '');
  const emptyClass = size === 64 ? 'modal-avatar-empty' : 'avatar-empty';
  const url = getAvatarUrl(s);
  const badgesClass = size === 64 ? 'modal-sns-badges' : 'sns-badges';

  const xBadge   = (s.x_handle && s.x_handle.startsWith('@')) ? `<span class="${dotSize} x-dot">𝕏</span>` : '';
  const liBadge  = (s.linkedin && s.linkedin.includes('linkedin')) ? `<span class="${dotSize} li-dot">in</span>` : '';
  const badges   = (xBadge || liBadge) ? `<div class="${badgesClass}">${xBadge}${liBadge}</div>` : '';

  if (url) {
    return `<div class="${wrapClass}">
      <img class="${imgClass}" src="${url}" width="${imgSize}" height="${imgSize}"
        onerror="this.classList.add('hidden');this.nextSibling && this.nextSibling.classList && this.nextSibling.classList.remove('hidden')">
      <div class="${emptyClass}" style="display:none"></div>
      ${badges}
    </div>`;
  } else if (hasSnS(s)) {
    // Has LinkedIn but no X photo
    return `<div class="${wrapClass}">
      <div class="${emptyClass}"><span style="font-size:${size===64?22:14}px;color:#0a66c2;font-weight:900">in</span></div>
      ${badges}
    </div>`;
  } else {
    // No SNS at all - empty
    return `<div class="${wrapClass}">
      <div class="${emptyClass}"></div>
    </div>`;
  }
}

  buildCatFilters();
  doFilter();
  buildCatPage();
  buildSessionsPage();
}

// ── CAT FILTER BUTTONS ────────────────────────────────────────
function buildCatFilters() {
  const c = document.getElementById('catFilters');
  CAT_ORDER.forEach(cat => {
    const n = SPEAKERS.filter(s => s.category === cat).length;
    if (!n) return;
    const b = document.createElement('button');
    b.className = 'filter-chip';
    b.textContent = `${cat} (${n})`;
    b.onclick = () => { toggleFilter(cat, b); };
    c.appendChild(b);
  });
}

function toggleFilter(cat, btn) {
  if (activeFilters.has(cat)) { activeFilters.delete(cat); btn.classList.remove('active'); }
  else { activeFilters.add(cat); btn.classList.add('active'); }
  doFilter();
}

function toggleChip(type, btn) {
  if (type === 'key') {
    // Key = all three on
    const on = smartFilters.has('key');
    if (on) {
      smartFilters.delete('key'); smartFilters.delete('featured'); smartFilters.delete('sns'); smartFilters.delete('quote');
      btn.classList.remove('active');
      document.querySelectorAll('.chip-star,.chip-sns,.chip-quote').forEach(b=>b.classList.remove('active'));
    } else {
      smartFilters.add('key'); smartFilters.add('featured'); smartFilters.add('sns'); smartFilters.add('quote');
      btn.classList.add('active');
      document.querySelectorAll('.chip-star').forEach(b=>b.classList.add('active'));
      document.querySelectorAll('.chip-sns').forEach(b=>b.classList.add('active'));
      document.querySelectorAll('.chip-quote').forEach(b=>b.classList.add('active'));
    }
  } else {
    if (smartFilters.has(type)) { smartFilters.delete(type); btn.classList.remove('active'); }
    else { smartFilters.add(type); btn.classList.add('active'); }
    smartFilters.delete('key');
    document.querySelectorAll('.chip-key').forEach(b=>b.classList.remove('active'));
    if (smartFilters.has('featured') && smartFilters.has('sns') && smartFilters.has('quote')) {
      smartFilters.add('key');
      document.querySelectorAll('.chip-key').forEach(b=>b.classList.add('active'));
    }
  }
  doFilter();
}

// ── FILTER & RENDER ───────────────────────────────────────────
function doFilter() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const filtered = SPEAKERS.filter(s => {
    if (smartFilters.has('featured') && !s.featured) return false;
    if (smartFilters.has('sns') && !hasSnS(s)) return false;
    if (smartFilters.has('quote') && !s.quote) return false;
    if (activeFilters.size > 0 && !activeFilters.has(s.category)) return false;
    if (q) {
      const hay = [s.name,s.title,s.company,s.country,s.category,s.quote,s.thesis].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  document.getElementById('resultNum').textContent = filtered.length;
  document.getElementById('hdr-total').textContent = filtered.length;
  renderGrid(filtered);
}

function renderGrid(list) {
  const grid = document.getElementById('speakerGrid');
  grid.innerHTML = '';
  list.forEach(s => {
    const card = document.createElement('div');
    card.className = 'speaker-card' + (s.featured ? ' is-featured' : '');
    card.onclick = () => openModal(s);
    card.innerHTML = `
      ${s.featured ? '<div class="featured-badge">★ 확정</div>' : ''}
      <div class="card-top">
        ${makeAvatarHtml(s, 46)}
        <div class="card-info">
          <div class="card-name">${s.name}</div>
          <div class="card-title">${s.title}</div>
          <div class="card-company">${s.company}</div>
        </div>
      </div>
      <div class="card-tags">
        ${s.category ? `<span class="tag cat">${s.category}</span>` : ''}
        ${s.country  ? `<span class="tag country">${s.country}</span>` : ''}
      </div>
      ${s.quote ? `<div class="card-quote">${s.quote}</div>` : ''}
    `;
    grid.appendChild(card);
  });
}

// ── VIEW TOGGLE ───────────────────────────────────────────────
function setView(v, btn) {
  currentView = v;
  document.querySelectorAll('.vbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const grid = document.getElementById('speakerGrid');
  if (v === 'list') grid.classList.add('list-view');
  else grid.classList.remove('list-view');
}

// ── MODAL ─────────────────────────────────────────────────────
function openModal(s) {
  const xLink = (s.x_handle && s.x_handle.startsWith('@'))
    ? `<a class="mlink x-link" href="https://x.com/${s.x_handle.replace('@','')}" target="_blank"><span style="font-weight:900">𝕏</span> ${s.x_handle}</a>` : '';
  const liLink = (s.linkedin && s.linkedin.includes('linkedin'))
    ? `<a class="mlink li-link" href="${s.linkedin}" target="_blank"><span style="font-weight:900">in</span> LinkedIn</a>` : '';
  const emailLink = s.email ? `<a class="mlink" href="mailto:${s.email}">✉ ${s.email}</a>` : '';
  const links = xLink + liLink + emailLink;

  document.getElementById('modalContent').innerHTML = `
    <button class="modal-close" onclick="document.getElementById('modalOverlay').classList.remove('open')">✕</button>
    <div class="modal-header">
      ${makeAvatarHtml(s, 64)}
      <div style="flex:1;min-width:0">
        <div class="modal-name">${s.name} ${s.featured ? '<span style="color:var(--accent);font-size:0.8rem">★ 확정</span>' : ''}</div>
        <div class="modal-title">${s.title}</div>
        <div class="modal-company">${s.company}</div>
        <div class="modal-tags">
          ${s.category ? `<span class="tag cat">${s.category}</span>` : ''}
          ${s.country  ? `<span class="tag country">${s.country}</span>` : ''}
        </div>
      </div>
    </div>
    ${s.company_desc ? `<div class="msec"><h4>🏢 회사 소개</h4><p>${s.company_desc}</p></div>` : ''}
    ${s.quote ? `<div class="msec"><h4>💬 최근 발언</h4><div class="quote-box">${s.quote}</div></div>` :
      s.activity ? `<div class="msec"><h4>💬 최근 활동</h4><p>${s.activity}</p></div>` : ''}
    ${s.thesis ? `<div class="msec"><h4>🎯 핵심 테제</h4><p>${s.thesis}</p></div>` : ''}
    ${links ? `<div class="msec"><h4>🔗 소셜 / 연락처</h4><div class="modal-links">${links}</div></div>` : ''}
  `;
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModalOutside(e) {
  if (e.target === document.getElementById('modalOverlay'))
    document.getElementById('modalOverlay').classList.remove('open');
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('modalOverlay').classList.remove('open');
});

// ── CAT PAGE ──────────────────────────────────────────────────
function buildCatPage() {
  const c = document.getElementById('catPage');
  CAT_ORDER.forEach(cat => {
    const list = SPEAKERS.filter(s => s.category === cat);
    if (!list.length) return;
    const sec = document.createElement('div');
    sec.className = 'cat-section';
    const items = list.map(s => `
      <div class="cat-item" onclick="openModalFromCat('${s.name.replace(/'/g,"\'")}')">
        <div class="cat-item-name">${s.name}${s.featured?' ★':''}</div>
        <div class="cat-item-meta">${s.title}${s.company?' · '+s.company:''}${s.country?' · '+s.country:''}</div>
        ${s.quote ? `<div class="cat-item-q">${s.quote}</div>` : ''}
      </div>`).join('');
    sec.innerHTML = `
      <div class="cat-hdr"><span>${cat}</span><span class="cat-cnt">${list.length}명</span></div>
      <div class="cat-list">${items}</div>`;
    c.appendChild(sec);
  });
}

function openModalFromCat(name) {
  const s = SPEAKERS.find(x => x.name === name);
  if (s) openModal(s);
}

// ── SESSION PAGE ──────────────────────────────────────────────
function buildSessionsPage() {
  const c = document.getElementById('sessionsPage');
  SESSIONS.forEach(sess => {
    const el = document.createElement('div');
    el.className = 'session-card';
    el.innerHTML = `
      <div class="session-ttl">${sess.title}</div>
      <div class="session-body">
        <div class="session-content">${sess.content}</div>
        <div class="session-speakers"><strong>추천 연사:</strong> ${sess.speakers}</div>
      </div>`;
    c.appendChild(el);
  });
}

// ── NAV ───────────────────────────────────────────────────────
function showPage(id, tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  tab.classList.add('active');
}

init();
</script>
</body>
